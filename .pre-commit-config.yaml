default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: local
    hooks:
      - id: test-coverage
        name: tests with 100% coverage
        entry: python -m coverage run -m pytest -m 'not pypi'
        language: python
        additional_dependencies:
          - coverage[toml]>=7.6,<8
          - pytest>=8.3,<9
          - spotipy==2.23.0
          - python-daemon==3.0.1
          - dbus-next==0.2.3
        pass_filenames: false
        always_run: true
      - id: coverage-threshold
        name: enforce 100% coverage
        entry: python -m coverage report
        language: python
        additional_dependencies:
          - coverage[toml]>=7.6,<8
          - pytest>=8.3,<9
          - spotipy==2.23.0
          - python-daemon==3.0.1
          - dbus-next==0.2.3
        pass_filenames: false
        always_run: true
