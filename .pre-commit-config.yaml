default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: test-coverage
        name: tests with 100% coverage
        entry: python -m coverage run -m pytest
        language: python
        additional_dependencies:
          - coverage[toml]>=7.6,<8
          - pytest>=8.3,<9
          - spotipy==2.23.0
          - python-daemon==3.0.1
        pass_filenames: false
        always_run: true
      - id: coverage-threshold
        name: enforce 100% coverage
        entry: python -m coverage report
        language: python
        additional_dependencies:
          - coverage[toml]>=7.6,<8
          - pytest>=8.3,<9
          - spotipy==2.23.0
          - python-daemon==3.0.1
        pass_filenames: false
        always_run: true
